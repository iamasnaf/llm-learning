[project]
name = "llm-learning"
version = "0.1.0"
description = "LLM learning sandbox and experiments"
readme = "README.md"
authors = [
    { name = "Asnaf Shaikh", email = "asnafshaikhpro@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "jupyter>=1.1.1",
]

[project.scripts]
llm-learning = "llm_learning:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
